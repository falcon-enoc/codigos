[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svg-converter"
version = "1.0.0"
description = "Herramienta para convertir imágenes SVG a PNG o JPEG"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "enocfalcon"}
]
keywords = ["svg", "png", "jpeg", "converter", "image", "conversion"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]

dependencies = [
    "cairosvg==2.7.1",
    "cairocffi==1.7.1",
    "cffi==1.17.1",
    "pycparser==2.22",
    "Pillow==11.0.0",
    "defusedxml==0.7.1",
    "cssselect2==0.7.0",
    "tinycss2==1.4.0",
    "webencodings==0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
svg-converter = "svg_converter:main"

[project.urls]
Homepage = "https://github.com/enocfalcon/python-codigos"
Repository = "https://github.com/enocfalcon/python-codigos"

[tool.setuptools]
py-modules = ["svg_converter"]

[tool.black]
line-length = 100
target-version = ['py37', 'py38', 'py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
target-version = "py37"
